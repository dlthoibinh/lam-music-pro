jobs:
  core:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Prepare official tools without checking out application sources
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          echo "GRADLE_USER_HOME=$RUNNER_TEMP/tool-gradle-home" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/transfer" "$RUNNER_TEMP/probe/app/src/main/java/org/example/toolprobe" "$RUNNER_TEMP/probe/app/src/test/java/org/example/toolprobe" "$RUNNER_TEMP/probe/app/src/androidTest/java/org/example/toolprobe"
          curl --fail --location --retry 3 https://services.gradle.org/distributions/gradle-8.13-bin.zip -o "$RUNNER_TEMP/transfer/gradle.zip"
          echo "20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78  $RUNNER_TEMP/transfer/gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/transfer/gradle.zip" -d "$RUNNER_TEMP/transfer"
          rm "$RUNNER_TEMP/transfer/gradle.zip"
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'build-tools;36.0.0' 'platform-tools'
      - name: Resolve public dependencies using a synthetic project only
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/probe"
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "PublicToolchainProbe"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
            id("com.android.application") version "8.13.2" apply false
            id("org.jetbrains.kotlin.android") version "2.3.21" apply false
            id("org.jetbrains.kotlin.plugin.compose") version "2.3.21" apply false
            id("com.google.devtools.ksp") version "2.3.9" apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.compiler.execution.strategy=in-process
          org.gradle.workers.max=2
          EOF
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          cat > app/build.gradle.kts <<'EOF'
          import org.jetbrains.kotlin.gradle.dsl.JvmTarget
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android"); id("org.jetbrains.kotlin.plugin.compose"); id("com.google.devtools.ksp") }
          android {
            namespace = "org.example.toolprobe"
            compileSdk = 36
            defaultConfig { applicationId = "org.example.toolprobe"; minSdk = 26; targetSdk = 36; versionCode = 1; versionName = "1"; testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner" }
            buildFeatures { compose = true; buildConfig = true }
            compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17; isCoreLibraryDesugaringEnabled = true }
          }
          kotlin { compilerOptions { jvmTarget.set(JvmTarget.JVM_17) } }
          ksp { arg("room.schemaLocation", "$projectDir/schemas") }
          dependencies {
            coreLibraryDesugaring("com.android.tools:desugar_jdk_libs_nio:2.1.5")
            implementation(platform("androidx.compose:compose-bom:2025.02.00"))
            implementation("androidx.activity:activity-compose:1.10.1")
            implementation("androidx.fragment:fragment:1.8.9")
            implementation("androidx.core:core-ktx:1.16.0")
            implementation("androidx.compose.material3:material3")
            implementation("androidx.compose.material:material-icons-extended")
            implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.7")
            implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7")
            implementation("androidx.car.app:app:1.7.0")
            implementation("androidx.car.app:app-projected:1.7.0")
            implementation("org.maplibre.gl:android-sdk-opengl:13.5.1")
            implementation("androidx.media:media:1.8.0")
            listOf("exoplayer", "exoplayer-hls", "exoplayer-dash", "exoplayer-smoothstreaming", "exoplayer-rtsp", "ui", "session", "datasource").forEach { implementation("androidx.media3:media3-$it:1.11.0") }
            implementation("com.squareup.okhttp3:okhttp:5.4.0")
            implementation("androidx.work:work-runtime-ktx:2.10.1")
            implementation("androidx.profileinstaller:profileinstaller:1.4.1")
            implementation("androidx.room:room-runtime:2.7.2")
            ksp("androidx.room:room-compiler:2.7.2")
            listOf("android", "guava", "play-services").forEach { implementation("org.jetbrains.kotlinx:kotlinx-coroutines-$it:1.10.1") }
            implementation(platform("com.google.firebase:firebase-bom:34.16.0"))
            listOf("auth", "firestore", "messaging", "functions", "appcheck-playintegrity").forEach { implementation("com.google.firebase:firebase-$it") }
            implementation("androidx.credentials:credentials:1.3.0")
            implementation("androidx.credentials:credentials-play-services-auth:1.3.0")
            implementation("com.google.android.libraries.identity.googleid:googleid:1.1.1")
            implementation("com.android.billingclient:billing:9.1.0")
            implementation("com.google.android.gms:play-services-ads:25.4.0")
            implementation("com.google.android.ump:user-messaging-platform:4.0.0")
            implementation("com.google.android.play:app-update:2.1.0")
            implementation("com.google.android.play:app-update-ktx:2.1.0")
            implementation("com.google.android.play:review:2.0.2")
            implementation("com.google.android.play:review-ktx:2.0.2")
            testImplementation("junit:junit:4.13.2")
            testImplementation("org.jetbrains.kotlin:kotlin-test:2.3.21")
            testImplementation("org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.1")
            testImplementation("org.json:json:20240303")
            androidTestImplementation(platform("androidx.compose:compose-bom:2025.02.00"))
            androidTestImplementation("androidx.compose.ui:ui-test-junit4")
            debugImplementation("androidx.compose.ui:ui-test-manifest")
            androidTestImplementation("androidx.test:core-ktx:1.7.0")
            androidTestImplementation("androidx.test.ext:junit-ktx:1.3.0")
            androidTestImplementation("androidx.test:runner:1.7.0")
            androidTestImplementation("androidx.test:rules:1.7.0")
            androidTestImplementation("androidx.test.espresso:espresso-core:3.7.0")
            androidTestImplementation("androidx.test.espresso:espresso-device:1.1.0")
            androidTestImplementation("androidx.test.uiautomator:uiautomator:2.3.0")
            androidTestImplementation("androidx.room:room-testing:2.7.2")
            androidTestImplementation("org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.1")
            androidTestUtil("androidx.test:orchestrator:1.6.1")
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:label="Toolchain probe" android:theme="@android:style/Theme.Material.Light.NoActionBar"><activity android:name=".ProbeActivity" android:exported="false"/><meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/></application></manifest>
          EOF
          cat > app/src/main/java/org/example/toolprobe/ProbeActivity.kt <<'EOF'
          package org.example.toolprobe
          import androidx.activity.ComponentActivity
          import androidx.compose.runtime.Composable
          import androidx.compose.material3.Text
          import androidx.room.Database
          import androidx.room.Entity
          import androidx.room.PrimaryKey
          import androidx.room.RoomDatabase
          class ProbeActivity : ComponentActivity()
          @Composable fun ProbeText() { Text("Toolchain probe") }
          @Entity data class ProbeRow(@PrimaryKey val id: Long)
          @Database(entities = [ProbeRow::class], version = 1, exportSchema = true) abstract class ProbeDb : RoomDatabase()
          EOF
          cat > app/src/test/java/org/example/toolprobe/CompilerProbeTest.kt <<'EOF'
          package org.example.toolprobe
          import org.junit.Test
          import org.junit.Assert.assertEquals
          class CompilerProbeTest { @Test fun compilerWorks() { assertEquals(4, 2 + 2) } }
          EOF
          cat > app/src/androidTest/java/org/example/toolprobe/RuntimeProbeTest.kt <<'EOF'
          package org.example.toolprobe
          import androidx.test.ext.junit.runners.AndroidJUnit4
          import org.junit.Test
          import org.junit.runner.RunWith
          import org.junit.Assert.assertTrue
          @RunWith(AndroidJUnit4::class) class RuntimeProbeTest { @Test fun minimumSdk() { assertTrue(android.os.Build.VERSION.SDK_INT >= 26) } }
          EOF
          "$RUNNER_TEMP/transfer/gradle-8.13/bin/gradle" --no-daemon --console=plain :app:assembleDebug :app:testDebugUnitTest :app:assembleDebugAndroidTest :app:lintDebug --stacktrace 2>&1 | tee "$RUNNER_TEMP/probe-build.log"
      - name: Encrypt the toolchain for local use; do not publish SDK bytes in plaintext
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          mkdir -p transfer/gradle-home/caches transfer/android-sdk/{platforms,build-tools} transfer/evidence out
          test -d "$GRADLE_USER_HOME/caches/modules-2" && cp -a "$GRADLE_USER_HOME/caches/modules-2" transfer/gradle-home/caches/
          for p in platforms/android-36 build-tools/35.0.0 build-tools/36.0.0 platform-tools licenses; do
            test ! -e "$ANDROID_HOME/$p" || cp -a "$ANDROID_HOME/$p" "transfer/android-sdk/$p"
          done
          test ! -f probe-build.log || cp probe-build.log transfer/evidence/
          find transfer -name '*.lock' -type f -delete
          printf '%s\n' "$TRANSFER_CERT" > recipient.crt
          tar -C transfer -czf core.tar.gz .
          sha256sum core.tar.gz | tee out/core-plaintext.sha256
          openssl cms -encrypt -binary -stream -aes-256-cbc -in core.tar.gz -outform DER -out core.cms recipient.crt
          split -b 280M -d -a 2 core.cms out/core.part.
          sha256sum out/core.part.* | tee out/core-parts.sha256
          du -h core.tar.gz core.cms out/core.part.*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: toolchain-core-00
          path: ${{ runner.temp }}/out/core.part.00
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: toolchain-core-01
          path: ${{ runner.temp }}/out/core.part.01
          compression-level: 0
          retention-days: 1
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: toolchain-core-02
          path: ${{ runner.temp }}/out/core.part.02
          compression-level: 0
          retention-days: 1
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: toolchain-core-03
          path: ${{ runner.temp }}/out/core.part.03
          compression-level: 0
          retention-days: 1
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: toolchain-core-checksums
          path: ${{ runner.temp }}/out/*.sha256
          retention-days: 1
          if-no-files-found: error
  emulator:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Prepare official emulator for local software-rendered testing
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'emulator' 'system-images;android-30;default;x86_64' 'platform-tools'
          mkdir -p "$RUNNER_TEMP/transfer/android-sdk/system-images/android-30/default" "$RUNNER_TEMP/out"
          cp -a "$ANDROID_HOME/emulator" "$RUNNER_TEMP/transfer/android-sdk/"
          cp -a "$ANDROID_HOME/platform-tools" "$RUNNER_TEMP/transfer/android-sdk/"
          cp -a "$ANDROID_HOME/system-images/android-30/default/x86_64" "$RUNNER_TEMP/transfer/android-sdk/system-images/android-30/default/"
          cp -a "$ANDROID_HOME/cmdline-tools" "$RUNNER_TEMP/transfer/android-sdk/"
          cd "$RUNNER_TEMP"
          printf '%s\n' "$TRANSFER_CERT" > recipient.crt
          tar -C transfer -czf emulator.tar.gz .
          sha256sum emulator.tar.gz | tee out/emulator-plaintext.sha256
          openssl cms -encrypt -binary -stream -aes-256-cbc -in emulator.tar.gz -outform DER -out emulator.cms recipient.crt
          split -b 280M -d -a 2 emulator.cms out/emulator.part.
          sha256sum out/emulator.part.* | tee out/emulator-parts.sha256
          du -h emulator.tar.gz out/emulator.part.*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: toolchain-emulator-00
          path: ${{ runner.temp }}/out/emulator.part.00
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: toolchain-emulator-01
          path: ${{ runner.temp }}/out/emulator.part.01
          compression-level: 0
          retention-days: 1
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: toolchain-emulator-02
          path: ${{ runner.temp }}/out/emulator.part.02
          compression-level: 0
          retention-days: 1
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: toolchain-emulator-03
          path: ${{ runner.temp }}/out/emulator.part.03
          compression-level: 0
          retention-days: 1
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: toolchain-emulator-04
          path: ${{ runner.temp }}/out/emulator.part.04
          compression-level: 0
          retention-days: 1
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: toolchain-emulator-checksums
          path: ${{ runner.temp }}/out/*.sha256
          retention-days: 1
          if-no-files-found: error
